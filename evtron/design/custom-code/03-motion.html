<!-- EVTRON motion. Elementor > Custom Code > "EVTRON motion" (site-wide). Transform/opacity only, no layout shift,
     reduced-motion respected, and content is fully visible if this script never runs. -->
<style>
@media (prefers-reduced-motion: no-preference){
  .ev-js .ev-rv{opacity:0;transform:translate3d(0,18px,0);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--ev-d,0ms)}
  .ev-js .ev-rv.ev-in{opacity:1;transform:none}
  .ev-word{display:inline-block;opacity:0;transform:translate3d(0,.45em,0);animation:evWord .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--ev-d,0ms)}
  @keyframes evWord{to{opacity:1;transform:none}}
  .ev-fade-in{opacity:0;animation:evFade .9s ease forwards;animation-delay:var(--ev-d,0ms)}
  @keyframes evFade{to{opacity:1}}
  .ev-charge{display:block;height:3px;width:min(220px,40%);margin-top:28px;border-radius:3px;background:#1F2833;overflow:hidden}
  .ev-charge i{display:block;height:100%;width:100%;background:#3BE37F;transform:scaleX(0);transform-origin:left;animation:evCharge 1.6s cubic-bezier(.4,0,.2,1) forwards;animation-delay:var(--ev-d,0ms)}
  @keyframes evCharge{to{transform:scaleX(1)}}
  .ev-step-line{position:relative}
  .ev-step-line::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:#3BE37F;transform:scaleX(0);transform-origin:left;transition:transform .9s cubic-bezier(.4,0,.2,1);transition-delay:var(--ev-d,0ms)}
  .ev-step-line.ev-in::before{transform:scaleX(1)}
  .ev-lift{transition:transform .25s ease,border-color .25s ease}
  .ev-lift:hover{transform:translate3d(0,-4px,0)}
  .ev-lift img{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .ev-lift:hover img{transform:scale(1.03)}
  .ev-tick{opacity:0;animation:evFade .5s ease forwards;animation-delay:var(--ev-d,0ms)}
}
header.ev-scrolled{background-color:rgba(11,15,20,.985)!important}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var root=document.documentElement; root.classList.add('ev-js');
  /* Header: more solid after scrolling */
  var hdr=document.querySelector('header.elementor-element');
  if(hdr){var on=function(){hdr.classList.toggle('ev-scrolled',window.scrollY>8)};on();window.addEventListener('scroll',on,{passive:true})}
  if(reduce)return;
  var main=document.querySelector('main main')||document.querySelector('main');
  /* Hero headline: word-by-word reveal + charge bar */
  var h1=main&&main.querySelector('h1');
  if(h1&&!h1.dataset.evSplit){
    h1.dataset.evSplit=1;
    var words=h1.textContent.trim().split(/\s+/);
    h1.setAttribute('aria-label',h1.textContent.trim());
    h1.innerHTML=words.map(function(w,i){return '<span class="ev-word" aria-hidden="true" style="--ev-d:'+(120+i*110)+'ms">'+w+'</span>'}).join(' ');
    var line2=h1.nextElementSibling;
    if(line2){line2.classList.add('ev-fade-in');line2.style.setProperty('--ev-d',(120+words.length*110+80)+'ms');
      var bar=document.createElement('span');bar.className='ev-charge';bar.setAttribute('aria-hidden','true');bar.innerHTML='<i style="--ev-d:'+(120+words.length*110+300)+'ms"></i>';line2.after(bar)}
  }
  /* Scroll reveal: direct content blocks of each section below the fold */
  var vh=window.innerHeight;
  var targets=[];
  (main?main.querySelectorAll(':scope > section'):[]).forEach(function(sec,si){
    if(si===0)return;
    var inner=sec.firstElementChild; if(!inner)return;
    [].forEach.call(inner.children,function(block){
      var kids=block.children.length>1&&block.children.length<=6&&getComputedStyle(block).display==='grid'?[].slice.call(block.children):[block];
      kids.forEach(function(k,i){if(k.getBoundingClientRect().top>vh*0.9){k.classList.add('ev-rv');k.style.setProperty('--ev-d',(i*90)+'ms');targets.push(k)}});
    });
  });
  /* "How it works" step lines fill in sequence */
  var how=main&&main.querySelectorAll(':scope > section')[2];
  var steps=how?how.querySelector(':scope > div > div:nth-child(2)'):null;
  if(steps){[].forEach.call(steps.children,function(s,i){s.classList.add('ev-step-line');s.style.setProperty('--ev-d',(250+i*220)+'ms');targets.push(s)})}
  /* Product cards lift */
  document.querySelectorAll('main article').forEach(function(a){a.classList.add('ev-lift')});
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('ev-in');io.unobserve(e.target)}})},{rootMargin:'0px 0px -8% 0px',threshold:0.08});
    targets.forEach(function(t){io.observe(t)});
  }else{targets.forEach(function(t){t.classList.add('ev-in')})}
});
</script>
