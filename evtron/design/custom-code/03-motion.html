<!-- EVTRON motion + signature details. Elementor > Custom Code > "EVTRON motion" (site-wide).
     Transform/opacity (and SVG stroke offset for the hero lines) only; no layout shift; reduced-motion respected;
     every piece of content is visible if this script never runs. -->
<style>
@media (prefers-reduced-motion: no-preference){
  .ev-js .ev-rv{opacity:0;transform:translate3d(0,18px,0);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--ev-d,0ms)}
  .ev-js .ev-rv.ev-in{opacity:1;transform:none}
  .ev-word{display:inline-block;opacity:0;transform:translate3d(0,.45em,0);animation:evWord .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--ev-d,0ms)}
  @keyframes evWord{to{opacity:1;transform:none}}
  .ev-fade-in{opacity:0;animation:evFade .9s ease forwards;animation-delay:var(--ev-d,0ms)}
  @keyframes evFade{to{opacity:1}}
  .ev-charge i{transform:scaleX(0);animation:evCharge 1.6s cubic-bezier(.4,0,.2,1) forwards;animation-delay:var(--ev-d,0ms)}
  @keyframes evCharge{to{transform:scaleX(1)}}
  .ev-step-line::before{transform:scaleX(0);transition:transform .9s cubic-bezier(.4,0,.2,1);transition-delay:var(--ev-d,0ms)}
  .ev-step-line.ev-in::before{transform:scaleX(1)}
  .ev-lift{transition:transform .25s ease,border-color .25s ease}
  .ev-lift:hover{transform:translate3d(0,-4px,0)}
  .ev-lift img{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .ev-lift:hover img{transform:scale(1.03)}
  .ev-tick{opacity:0;animation:evFade .5s ease forwards;animation-delay:var(--ev-d,0ms)}
  .ev-dial-arc{animation:evDial 2.6s cubic-bezier(.3,.6,.2,1) .4s forwards,evBreathe 5s ease-in-out 3.2s infinite}
  @keyframes evDial{to{stroke-dashoffset:var(--ev-to)}}
  @keyframes evBreathe{0%,100%{stroke-opacity:.38}50%{stroke-opacity:.2}}
}
@media (prefers-reduced-motion: reduce){.ev-dial-arc{stroke-dashoffset:var(--ev-to)!important}}
/* Charge bar under hero headline */
.ev-charge{display:block;height:3px;width:min(220px,40%);margin-top:28px;border-radius:3px;background:#1F2833;overflow:hidden}
.ev-charge i{display:block;height:100%;width:100%;background:#3BE37F;transform-origin:left}
/* Step lines */
.ev-step-line{position:relative}
.ev-step-line::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:#3BE37F;transform-origin:left}
/* Hero crossover line field (built from the logo's two curves) */
.ev-hero-host{position:relative;overflow:hidden;isolation:isolate}
.ev-flow{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:1}
.ev-flow path{fill:none;stroke-linecap:round}
.ev-flow .ev-pulse{stroke-dasharray:70 930}
/* Datasheet section index + crossover glyph on section lines */
.ev-idx{font-family:"IBM Plex Mono",ui-monospace,monospace;color:#939CA8}
.ev-glyph-host{position:relative}
.ev-glyph{position:absolute;top:-12px;left:max(32px,calc((100% - 1440px)/2 + 32px));width:30px;height:24px;background:#0B0F14;padding:0 4px;pointer-events:none}
@media(max-width:767px){.ev-glyph{left:16px}}
/* Spec strip on product cards */
.ev-spec-host{position:relative;overflow:hidden;border-radius:6px}
.ev-spec-strip{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;background:rgba(11,15,20,.88);border-top:1px solid #2A3441;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.04em;color:#F2EFE9;transform:translate3d(0,100%,0);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.ev-lift:hover .ev-spec-strip,.ev-lift:focus-within .ev-spec-strip{transform:none}
/* Header "charge the page" battery */
.ev-pbat{display:inline-flex;align-items:center;gap:8px;margin-right:4px;opacity:0;transform:translate3d(0,-4px,0);transition:opacity .3s ease,transform .3s ease;pointer-events:none;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:#939CA8;white-space:nowrap}
.ev-pbat b{position:relative;display:block;width:30px;height:14px;border:1.5px solid #6A7688;border-radius:3px;padding:1.5px}
.ev-pbat b::after{content:"";position:absolute;right:-4px;top:4px;width:2px;height:5px;border-radius:0 1px 1px 0;background:#6A7688}
.ev-pbat i{display:block;height:100%;width:100%;background:#3BE37F;border-radius:1px;transform-origin:left;transform:scaleX(var(--ev-p,0))}
.ev-pbat.ev-on{opacity:1;transform:none;pointer-events:auto;cursor:default}
@media(max-width:1180px){.ev-pbat span{display:none}}
@media(max-width:767px){.ev-pbat{display:none}}
header.ev-scrolled{background-color:rgba(11,15,20,.985)!important}
/* Footer smart charging clock */
.ev-clk-time{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:20px}
.ev-clk-now{margin:0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:500;font-size:clamp(44px,5vw,64px);line-height:1;color:#F2EFE9;font-variant-numeric:tabular-nums}
.ev-clk-day{margin:6px 0 0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#939CA8}
.ev-clk-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;border:1px solid rgba(59,227,127,.4);color:#3BE37F}
.ev-clk-pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.ev-clk-pill.peak{border-color:rgba(242,193,78,.45);color:#F2C14E}
@media (prefers-reduced-motion:no-preference){.ev-clk-pill i{animation:evPulse 2s ease-in-out infinite}@keyframes evPulse{50%{opacity:.35}}}
.ev-clk-bar{position:relative;display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-top:24px}
.ev-clk-bar span{height:28px;border-radius:2px;background:#1F2833}
.ev-clk-bar span.pk{background:rgba(242,193,78,.28)}
.ev-clk-bar span.off{background:rgba(59,227,127,.22)}
.ev-clk-mark{position:absolute;top:-6px;bottom:-6px;width:2px;background:#F2EFE9;border-radius:2px;transform:translateX(-1px)}
.ev-clk-axis{display:flex;justify-content:space-between;margin-top:8px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;color:#939CA8}
.ev-clk-key{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:#C3C7CD}
.ev-clk-key b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.ev-clk-next{margin:16px 0 0;font-size:14.5px;color:#C3C7CD}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.documentElement.classList.add('ev-js');
  var targets=[];
  var main=document.querySelector('main main')||document.querySelector('main');
  var secs=main?[].slice.call(main.querySelectorAll(':scope > section')):[];
  /* Header: solid on scroll + "charge the page" battery */
  /* Utility row: rotate USPs on phones */
  (function(){var u=[].slice.call(document.querySelectorAll('.ev-usp'));if(!u.length)return;var i=0;u[0].classList.add('on');
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    setInterval(function(){if(window.innerWidth>767)return;u[i].classList.remove('on');i=(i+1)%u.length;u[i].classList.add('on')},3200)})();
  var hdr=document.querySelector('header.elementor-element');
  var bat=null;
  if(hdr){
    var act=hdr.querySelector('.elementor-widget-woocommerce-menu-cart');
    if(act&&act.parentElement){bat=document.createElement('span');bat.className='ev-pbat';bat.setAttribute('aria-hidden','true');bat.innerHTML='<b><i></i></b><span>0%</span>';bat.title='Page charged: 0%';act.parentElement.insertBefore(bat,act)}
  }
  var ticking=false;
  function onScroll(){
    var y=window.scrollY,max=Math.max(1,document.documentElement.scrollHeight-window.innerHeight),pc=Math.min(1,y/max);
    if(hdr)hdr.classList.toggle('ev-scrolled',y>8);
    if(bat){var pct=Math.round(pc*100);bat.style.setProperty('--ev-p',pc.toFixed(3));bat.lastChild.textContent=pct+'%';bat.title='Page charged: '+pct+'%';bat.classList.toggle('ev-on',pct>=1)}
    revealPassed();ticking=false;
  }
  window.addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(onScroll)}},{passive:true});
  /* Datasheet index on section eyebrows + crossover glyph on section lines */
  var isV2=!!document.querySelector('.v2-hero')||!!document.querySelector('.ev-plain');
  var total=secs.length-1;
  var GLYPH='<svg viewBox="2 4 62 56" width="22" height="20" aria-hidden="true"><path d="M8 14C28 14 32 50 52 50" fill="none" stroke="#3BE37F" stroke-width="7" stroke-linecap="round"/><path d="M8 50C28 50 30 18 44 18" fill="none" stroke="#3BE37F" stroke-width="7" stroke-linecap="round"/></svg>';
  secs.forEach(function(sec,i){
    if(i===0||isV2)return;
    var eb=sec.querySelector('.ev-label');
    if(eb&&!eb.dataset.evIdx){eb.dataset.evIdx=1;eb.innerHTML='<span class="ev-idx">'+String(i).padStart(2,'0')+' / '+String(total).padStart(2,'0')+'</span>  ·  '+eb.innerHTML}
    if(getComputedStyle(sec).borderTopWidth!=='0px'){sec.classList.add('ev-glyph-host');var g=document.createElement('span');g.className='ev-glyph';g.innerHTML=GLYPH;sec.prepend(g)}
  });
  /* Product cards: lift + spec strip */
  document.querySelectorAll('main article').forEach(function(a){
    a.classList.add('ev-lift');
    var img=a.querySelector('img'),spec=[].slice.call(a.querySelectorAll('p')).find(function(p){return /kW/.test(p.textContent)});
    if(img&&spec){var wrap=document.createElement('div');wrap.className='ev-spec-host';img.parentNode.insertBefore(wrap,img);wrap.appendChild(img);var st=document.createElement('div');st.className='ev-spec-strip';st.setAttribute('aria-hidden','true');st.textContent=spec.textContent;wrap.appendChild(st)}
  });

  /* Footer: live smart charging clock (UK default peak hours, weekdays 8-11 and 16-22) */
  var clkLabel=[].slice.call(document.querySelectorAll('footer p')).find(function(p){return /Smart charging clock/.test(p.textContent)});
  if(clkLabel){
    var panel=clkLabel.parentElement.parentElement,fb=clkLabel.parentElement.nextElementSibling;
    var ui=document.createElement('div');ui.setAttribute('aria-live','polite');
    ui.innerHTML='<div class="ev-clk-time"><div><p class="ev-clk-now" id="ev-clk-now">--:--</p><p class="ev-clk-day" id="ev-clk-day"></p></div><span class="ev-clk-pill" id="ev-clk-pill"><i></i><span></span></span></div>'+
      '<div class="ev-clk-bar" id="ev-clk-bar" aria-hidden="true">'+Array.apply(null,{length:24}).map(function(){return '<span></span>'}).join('')+'<em class="ev-clk-mark" id="ev-clk-mark"></em></div>'+
      '<div class="ev-clk-axis" aria-hidden="true"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>'+
      '<div class="ev-clk-key"><span><b style="background:rgba(59,227,127,.5)"></b>Outside default peak</span><span><b style="background:rgba(242,193,78,.6)"></b>Default peak hours</span></div>'+
      '<p class="ev-clk-next" id="ev-clk-next"></p>';
    if(fb)fb.replaceWith(ui);else panel.appendChild(ui);
    var fmtT=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',hour12:false});
    var fmtD=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',weekday:'long'});
    var dur=function(m){var h=Math.floor(m/60),r=m%60;return (h?h+'h ':'')+r+'m'};
    var tick=function(){
      var now=new Date(),t=fmtT.format(now),day=fmtD.format(now),hh=+t.slice(0,2),mm=+t.slice(3,5),mins=hh*60+mm;
      var wk=['Saturday','Sunday'].indexOf(day)<0;
      var pk=function(h){return wk&&((h>=8&&h<11)||(h>=16&&h<22))};
      var isPk=wk&&((mins>=480&&mins<660)||(mins>=960&&mins<1320));
      document.getElementById('ev-clk-now').textContent=t;
      document.getElementById('ev-clk-day').textContent=day+(wk?' · weekday':' · weekend');
      var pill=document.getElementById('ev-clk-pill');pill.classList.toggle('peak',isPk);pill.lastChild.textContent=isPk?'Default peak hours':'Good time to charge';
      [].forEach.call(document.getElementById('ev-clk-bar').querySelectorAll('span'),function(c,i){c.className=pk(i)?'pk':'off'});
      document.getElementById('ev-clk-mark').style.left=(mins/1440*100)+'%';
      var nx;
      if(!wk)nx='No default peak hours at weekends. Smart scheduling still follows your tariff.';
      else if(isPk){var end=mins<660?660:1320;nx='Default peak ends in '+dur(end-mins)+'.'}
      else{var st=mins<480?480:(mins<960?960:null);nx=st?'Next default peak starts in '+dur(st-mins)+'.':'No more default peak hours today.'}
      document.getElementById('ev-clk-next').textContent=nx;
    };
    tick();setInterval(tick,30000);
  }
  onScroll();
  if(reduce)return;
  /* Hero: charging dial (LED-ring inspired) behind the price receipt */
  var hero=secs[0];
  if(hero&&!hero.classList.contains('v2-hero')&&!document.querySelector('.ev-plain')){
    hero.classList.add('ev-hero-host');
    var cx=1060,cy=470,R=430,C=2*Math.PI*R,ticks='';
    for(var t=0;t<72;t++){var ang=(-225+t*(270/71))*Math.PI/180,long=t%9===0,r1=R+18,r2=R+(long?44:30);
      ticks+='<line x1="'+(cx+r1*Math.cos(ang)).toFixed(1)+'" y1="'+(cy+r1*Math.sin(ang)).toFixed(1)+'" x2="'+(cx+r2*Math.cos(ang)).toFixed(1)+'" y2="'+(cy+r2*Math.sin(ang)).toFixed(1)+'" stroke="'+(long?'#2A3441':'#1A2230')+'" stroke-width="'+(long?2:1)+'"/>'}
    var arcLen=C*0.75;
    var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','ev-flow ev-dial');svg.setAttribute('viewBox','0 0 1440 900');svg.setAttribute('preserveAspectRatio','xMidYMid slice');svg.setAttribute('aria-hidden','true');
    svg.innerHTML='<g transform="rotate(135 '+cx+' '+cy+')">'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#141B24" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+arcLen.toFixed(1)+' '+C.toFixed(1)+'"/>'+
      '<circle class="ev-dial-arc" cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#3BE37F" stroke-opacity=".38" stroke-width="6" stroke-linecap="round" style="--ev-len:'+arcLen.toFixed(1)+';--ev-to:'+(arcLen*0.2).toFixed(1)+';stroke-dasharray:'+arcLen.toFixed(1)+' '+C.toFixed(1)+';stroke-dashoffset:'+arcLen.toFixed(1)+'"/>'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R-40)+'" fill="none" stroke="#131A23" stroke-width="1"/></g>'+ticks+
      '<text x="'+(cx+(R+70)*Math.cos(135*Math.PI/180)).toFixed(0)+'" y="'+(cy+(R+70)*Math.sin(135*Math.PI/180)+4).toFixed(0)+'" fill="#3A4655" font-family="IBM Plex Mono, monospace" font-size="14" text-anchor="middle">0</text>'+
      '<text x="'+(cx+(R+78)*Math.cos(45*Math.PI/180)).toFixed(0)+'" y="'+(cy+(R+78)*Math.sin(45*Math.PI/180)+4).toFixed(0)+'" fill="#3A4655" font-family="IBM Plex Mono, monospace" font-size="14" text-anchor="middle">7kW</text>';
    hero.prepend(svg);
  }
  /* Hero headline: word-by-word reveal + charge bar */
  var h1=main&&main.querySelector('h1');
  if(h1&&!h1.dataset.evSplit){
    h1.dataset.evSplit=1;var words=h1.textContent.trim().split(/\s+/);
    h1.setAttribute('aria-label',h1.textContent.trim());
    h1.innerHTML=words.map(function(w,i){return '<span class="ev-word" aria-hidden="true" style="--ev-d:'+(120+i*110)+'ms">'+w+'</span>'}).join(' ');
    var line2=h1.nextElementSibling;
    if(line2&&!h1.closest('.v2-hero')&&!h1.closest('.ev-plain')){line2.classList.add('ev-fade-in');line2.style.setProperty('--ev-d',(120+words.length*110+80)+'ms');
      var bar=document.createElement('span');bar.className='ev-charge';bar.setAttribute('aria-hidden','true');bar.innerHTML='<i style="--ev-d:'+(120+words.length*110+300)+'ms"></i>';line2.after(bar)}
  }
  /* Reveal targets: blocks below the fold. Fail-safe: anything scrolled to OR past is revealed. */
  var vh=window.innerHeight;
  secs.forEach(function(sec,si){
    if(si===0)return;var inner=[].slice.call(sec.children).find(function(c){return c.tagName==='DIV'&&!c.classList.contains('ev-glyph')});if(!inner)return;
    [].forEach.call(inner.children,function(block){
      var kids=block.children.length>1&&block.children.length<=6&&getComputedStyle(block).display==='grid'?[].slice.call(block.children):[block];
      kids.forEach(function(k,i){if(k.getBoundingClientRect().top>vh*0.9){k.classList.add('ev-rv');k.style.setProperty('--ev-d',(i*90)+'ms');targets.push(k)}});
    });
  });
  var how=secs.find(function(x){return /From order to first charge/.test(x.textContent)}),steps=how?how.querySelector(':scope > div > div:nth-child(2)'):null;
  if(steps){[].forEach.call(steps.children,function(s,i){s.classList.add('ev-step-line');s.style.setProperty('--ev-d',(250+i*220)+'ms');targets.push(s)})}
  function revealPassed(){
    if(!targets||!targets.length)return;var lim=window.innerHeight*0.92;
    targets=targets.filter(function(t){if(t.getBoundingClientRect().top<lim){t.classList.add('ev-in');return false}return true});
  }
  revealPassed();
});
</script>
