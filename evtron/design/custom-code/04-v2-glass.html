<!-- EVTRON V2 glassmorphism layer. Elementor > Custom Code > "EVTRON V2 glass" (Home V2 page only).
     Glass needs something defined behind it: each section gets brand shapes (orbs + the crossover mark)
     placed under its panels, and panels become translucent, blurred and edge-lit.
     Text sits on panels that stay dark enough for AA contrast (checked on the brightest shape). -->
<style>
html.ev-glass{background:#05080B!important}
html.ev-glass body,html.ev-glass #page,html.ev-glass .site,html.ev-glass .site-content,html.ev-glass .ast-container,html.ev-glass #content,html.ev-glass main,html.ev-glass .elementor,html.ev-glass .elementor-location-footer{background:transparent!important}
html.ev-glass main section,html.ev-glass footer.elementor-element{background-color:transparent!important;position:relative;isolation:isolate}
html.ev-glass .ev-glyph{background:#05080B!important;border-radius:4px}
/* Decorative shapes behind panels */
.ev-deco{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.ev-deco .o{position:absolute;border-radius:50%}
.ev-deco .o.g{background:radial-gradient(circle at 35% 35%,#3BE37F 0%,rgba(59,227,127,.75) 30%,rgba(59,227,127,0) 70%);opacity:.42}
.ev-deco .o.e{background:radial-gradient(circle at 60% 40%,#1BA35A 0%,#0B7A3B 40%,rgba(11,122,59,0) 72%);opacity:.6}
.ev-deco .o.b{background:radial-gradient(circle at 50% 50%,#5B7FB8 0%,#3A5788 40%,rgba(58,87,136,0) 72%);opacity:.5}
.ev-deco svg{position:absolute}
@media (prefers-reduced-motion:no-preference){
  .ev-deco .o{animation:evFloat 18s ease-in-out infinite alternate}
  .ev-deco .o:nth-child(2n){animation-duration:23s;animation-direction:alternate-reverse}
  @keyframes evFloat{to{transform:translate3d(40px,-30px,0) scale(1.06)}}
  .ev-deco svg{animation:evSway 26s ease-in-out infinite alternate}
  @keyframes evSway{to{transform:translate3d(-30px,20px,0) rotate(-4deg)}}
}
/* Glass panels */
html.ev-glass .ev-g{
  background:linear-gradient(145deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.04) 45%,rgba(255,255,255,.02) 100%),rgba(8,11,15,.55)!important;
  -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  border:1px solid rgba(255,255,255,.16)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04),0 30px 80px -40px rgba(0,0,0,.85)!important;
  position:relative}
html.ev-glass .ev-g::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 28%)}
/* Dark glass for dense areas inside panels (keeps text contrast) */
html.ev-glass .ev-g-deep{background:rgba(5,8,11,.42)!important;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-color:rgba(255,255,255,.10)!important}
html.ev-glass .ev-calc-out{background:rgba(5,8,11,.28)!important}
html.ev-glass .ev-calc-tiles{background:rgba(255,255,255,.10)!important;border-color:rgba(255,255,255,.12)!important}
html.ev-glass .ev-calc-tiles>div{background:rgba(5,8,11,.45)!important}
html.ev-glass .ev-fd-row{background:rgba(5,8,11,.35)!important;border-color:rgba(255,255,255,.12)!important}
html.ev-glass .ev-fd-card{background:linear-gradient(160deg,rgba(59,227,127,.16),rgba(255,255,255,.04))!important;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-color:rgba(59,227,127,.55)!important}
/* Header */
html.ev-glass header.elementor-element{background-color:rgba(5,8,11,.55)!important;-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border-bottom-color:rgba(255,255,255,.10)!important}
html.ev-glass header.ev-scrolled{background-color:rgba(5,8,11,.62)!important}
/* Controls as glass */
html.ev-glass .ev-btn-ghost,html.ev-glass .ev-x-chip,html.ev-glass .ev-x-seg button,html.ev-glass .ev-fd-tg{background:rgba(255,255,255,.06)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-color:rgba(255,255,255,.22)!important}
html.ev-glass .ev-btn-primary{box-shadow:0 10px 30px -10px rgba(59,227,127,.55)}
html.ev-glass .ev-spec-strip{background:rgba(5,8,11,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
html.ev-glass .ev-gi{background:rgba(255,255,255,.08)!important;border-color:rgba(255,255,255,.18)!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
/* FAQ items as glass rows */
html.ev-glass main details{background:rgba(255,255,255,.04);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.10)!important;border-radius:12px!important;margin-bottom:8px}
html.ev-glass main details[open]{background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border-color:rgba(59,227,127,.45)!important}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){html.ev-glass .ev-g{background:#141A22!important}}
@media (forced-colors:active){.ev-deco{display:none}}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
  var root=document.documentElement;root.classList.add('ev-glass');
  var X='<path d="M8 14C28 14 32 50 52 50" fill="none" stroke-width="7" stroke-linecap="round"/><path d="M8 50C28 50 30 18 44 18" fill="none" stroke-width="7" stroke-linecap="round"/><rect x="44" y="11.5" width="11" height="13" rx="3"/><rect x="55" y="13" width="6" height="3" rx="1.5"/><rect x="55" y="20" width="6" height="3" rx="1.5"/>';
  function mark(css,col){return '<svg viewBox="2 4 62 56" style="'+css+'" stroke="'+col+'" fill="'+col+'" aria-hidden="true">'+X+'</svg>'}
  /* Per-section shapes: [orbs(type,x%,y%,size px)], crossover mark */
  var plan=[
    {o:[['g',62,8,520],['e',86,70,460],['b',48,78,300]],m:null},
    {o:[['e',10,40,520],['g',52,62,420],['b',88,30,380]],m:'right:-6%;top:12%;width:620px;height:560px;opacity:.55'},
    {o:[['g',20,70,380],['b',78,20,420]],m:'left:-8%;bottom:-10%;width:560px;height:500px;opacity:.45'},
    {o:[['e',72,30,560],['g',88,80,380],['b',30,85,320]],m:null},
    {o:[['g',75,25,460],['e',95,75,420]],m:'left:-6%;top:10%;width:520px;height:470px;opacity:.4'},
    {o:[['g',80,45,520],['b',58,90,360],['e',20,20,380]],m:'right:4%;top:6%;width:520px;height:470px;opacity:.5'}];
  var secs=[].slice.call(document.querySelectorAll('main > section'));
  var foot=document.querySelector('footer.elementor-element');
  var hosts=secs.concat(foot?[foot]:[]);
  hosts.forEach(function(sec,i){
    var p=plan[Math.min(i,plan.length-1)];if(i===hosts.length-1&&foot)p={o:[['g',78,22,560],['e',96,55,460],['b',60,8,300]],m:'left:-4%;bottom:6%;width:900px;height:810px;opacity:.12'};
    var d=document.createElement('div');d.className='ev-deco';d.setAttribute('aria-hidden','true');
    d.innerHTML=p.o.map(function(o){return '<span class="o '+o[0]+'" style="left:calc('+o[1]+'% - '+o[3]/2+'px);top:calc('+o[2]+'% - '+o[3]/2+'px);width:'+o[3]+'px;height:'+o[3]+'px"></span>'}).join('')+(p.m?mark(p.m,'#3BE37F'):'');
    sec.prepend(d);
  });
  var S1='rgb(17, 22, 29)',S2='rgb(23, 30, 39)',INK='rgb(11, 15, 20)';
  function glassify(){
    document.querySelectorAll('main *, footer.elementor-element *').forEach(function(el){
      if(el.closest('.ev-deco'))return;
      var par=el.parentElement&&el.parentElement.closest('.ev-g');
      var bg=getComputedStyle(el).backgroundColor;
      if(bg===S1&&!par){el.classList.add('ev-g')}
      else if(bg===S2&&el.getBoundingClientRect().width<80){el.classList.add('ev-gi')}
      else if(bg===INK&&el.tagName!=='SECTION'&&!el.classList.contains('ev-glyph')&&el.getBoundingClientRect().width<1200){el.classList.add('ev-g-deep')}
    });
  }
  glassify();setTimeout(glassify,700);
});
</script>
