<!-- EVTRON critical head. Elementor > Custom Code > "EVTRON critical head" (location: head, priority 1, entire site). -->
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0F14">
<style id="evtron-critical">
/* Dark only: paint the ink background before anything else so there is never a white flash. */
:root{color-scheme:dark;
  /* Astra palette mapped to EVTRON tokens (prevents Astra painting light backgrounds) */
  --ast-global-color-0:#3BE37F;--ast-global-color-1:#5CEB97;--ast-global-color-2:#F2EFE9;--ast-global-color-3:#C3C7CD;
  --ast-global-color-4:#0B0F14;--ast-global-color-5:#11161D;--ast-global-color-6:#171E27;--ast-global-color-7:#2A3441;--ast-global-color-8:#939CA8}
html,body,#page,.site,.site-content,.ast-container{background-color:#0B0F14!important}
body{color:#C3C7CD;font-family:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4,h5,h6{color:#F2EFE9;text-wrap:balance}
a{color:inherit}
::selection{background:#3BE37F;color:#06210F}
html{scrollbar-color:#3A4655 #0B0F14}
/* Visible focus on dark, everywhere */
:focus-visible{outline:2px solid #3BE37F!important;outline-offset:3px}
/* Dark autofill */
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,textarea:-webkit-autofill,select:-webkit-autofill{
  -webkit-text-fill-color:#F2EFE9;caret-color:#F2EFE9;box-shadow:0 0 0 1000px #171E27 inset;transition:background-color 9999s}
/* Elementor V4 icon widget: centre SVGs inside badges (no baseline offset) */
.e-svg-base{display:flex!important;align-items:center;justify-content:center;line-height:0;flex:0 0 auto;min-width:0}
.e-svg-base svg{display:block}
/* Sticky header: stick the Elementor header location wrapper (the inner element has no room to stick) */
.elementor-location-header{position:sticky;top:0;z-index:100}
.admin-bar .elementor-location-header{top:32px}
@media (max-width:782px){.admin-bar .elementor-location-header{top:46px}}
@media (max-width:600px){.admin-bar .elementor-location-header{top:0}}
/* Astra scroll-to-top: small, quiet glass circle */
#ast-scroll-top{width:44px!important;height:44px!important;border-radius:999px!important;background:rgba(12,25,20,.72)!important;color:#F2EFE9!important;
  border:1px solid rgba(190,255,215,.2)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);right:20px!important;bottom:20px!important;display:flex;align-items:center;justify-content:center}
#ast-scroll-top .ast-icon svg{fill:currentColor!important;width:14px;height:14px}
/* Cards: smooth green hover border */
.ev-card{transition:border-color .2s ease,transform .25s ease}
.ev-card:hover{transform:translateY(-3px)}
@media (prefers-reduced-motion:reduce){.ev-card:hover{transform:none}}
/* Numbers line up */
.ev-num,[class*="ev-price"],[class*="ev-label"]{font-variant-numeric:tabular-nums}
/* Skip link */
.ev-skip{position:absolute;left:16px;top:-60px;z-index:9999;background:#3BE37F;color:#06210F;padding:12px 16px;border-radius:6px;font-weight:600;text-decoration:none}
.ev-skip:focus{top:16px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media (forced-colors:active){
  .ev-btn-primary,.ev-btn-ghost,input,select,textarea,button{border:1px solid CanvasText!important}
  :focus-visible{outline:2px solid Highlight!important}
}
@media print{
  :root{color-scheme:light}
  html,body,#page,.site,.site-content{background:#fff!important;color:#111!important}
  h1,h2,h3,h4,h5,h6{color:#111!important}
  .elementor-location-header,.elementor-location-footer,.ev-btn-primary,.ev-btn-ghost{display:none!important}
}
</style>
