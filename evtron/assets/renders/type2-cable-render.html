<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}svg{display:block}</style></head><body>
<!-- Illustrated render of a Type 2 to Type 2 charging cable (coiled, two connectors). Placeholder until the client's product photos arrive. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A4049"/><stop offset=".5" stop-color="#17191D"/><stop offset="1" stop-color="#08090B"/></linearGradient>
    <linearGradient id="plug" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#454C56"/><stop offset=".55" stop-color="#1B1F24"/><stop offset="1" stop-color="#0C0E11"/></linearGradient>
    <radialGradient id="face" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#1A1E24"/><stop offset="1" stop-color="#07080A"/></radialGradient>
    <radialGradient id="floor" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#55E68B" stop-opacity=".35"/><stop offset="1" stop-color="#55E68B" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <ellipse cx="500" cy="520" rx="330" ry="300" fill="#55E68B" opacity=".08" filter="url(#soft)"/>
  <!-- coil: stacked loops -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#000" stroke-width="44" opacity=".45" filter="url(#sh)" transform="translate(8 16)">
      <ellipse cx="500" cy="520" rx="250" ry="205"/><ellipse cx="510" cy="505" rx="232" ry="190"/>
    </g>
    <ellipse cx="500" cy="540" rx="262" ry="214" stroke="url(#cab)" stroke-width="38"/>
    <ellipse cx="505" cy="525" rx="250" ry="204" stroke="url(#cab)" stroke-width="38"/>
    <ellipse cx="510" cy="510" rx="238" ry="194" stroke="url(#cab)" stroke-width="38"/>
    <ellipse cx="515" cy="495" rx="226" ry="184" stroke="url(#cab)" stroke-width="38"/>
    <g stroke="#fff" stroke-opacity=".10" stroke-width="5">
      <ellipse cx="500" cy="534" rx="262" ry="214"/><ellipse cx="505" cy="519" rx="250" ry="204"/><ellipse cx="510" cy="504" rx="238" ry="194"/><ellipse cx="515" cy="489" rx="226" ry="184"/>
    </g>
    <!-- green velcro strap -->
    <path d="M300 330 q-30 40 -16 92" stroke="#55E68B" stroke-width="30" opacity=".9"/>
    <!-- tails to plugs -->
    <path d="M720 430 C800 380 820 300 780 250" stroke="url(#cab)" stroke-width="36"/>
    <path d="M300 690 C240 760 250 830 330 860" stroke="url(#cab)" stroke-width="36"/>
  </g>
  <!-- Type 2 plug A (top right) -->
  <g transform="translate(780 200) rotate(-28)">
    <rect x="-46" y="-10" width="92" height="120" rx="30" fill="url(#plug)"/>
    <rect x="-34" y="96" width="68" height="40" rx="12" fill="#14171B"/>
    <path d="M-62 -40 h124 a8 8 0 0 1 8 8 v34 a46 46 0 0 1 -46 40 h-48 a46 46 0 0 1 -46 -40 v-34 a8 8 0 0 1 8 -8z" fill="url(#face)" stroke="#2C323A" stroke-width="6"/>
    <g fill="#3A4049"><circle cx="-24" cy="-14" r="7"/><circle cx="0" cy="-20" r="5"/><circle cx="24" cy="-14" r="7"/><circle cx="-34" cy="8" r="7"/><circle cx="0" cy="6" r="8"/><circle cx="34" cy="8" r="7"/><circle cx="0" cy="28" r="5"/></g>
    <rect x="-8" y="40" width="16" height="44" rx="8" fill="#55E68B" opacity=".9"/>
  </g>
  <!-- Type 2 plug B (bottom left) -->
  <g transform="translate(360 880) rotate(68)">
    <rect x="-46" y="-10" width="92" height="120" rx="30" fill="url(#plug)"/>
    <path d="M-62 -40 h124 a8 8 0 0 1 8 8 v34 a46 46 0 0 1 -46 40 h-48 a46 46 0 0 1 -46 -40 v-34 a8 8 0 0 1 8 -8z" fill="url(#face)" stroke="#2C323A" stroke-width="6"/>
    <g fill="#3A4049"><circle cx="-24" cy="-14" r="7"/><circle cx="0" cy="-20" r="5"/><circle cx="24" cy="-14" r="7"/><circle cx="-34" cy="8" r="7"/><circle cx="0" cy="6" r="8"/><circle cx="34" cy="8" r="7"/><circle cx="0" cy="28" r="5"/></g>
    <rect x="-8" y="40" width="16" height="44" rx="8" fill="#55E68B" opacity=".9"/>
  </g>
  <ellipse cx="500" cy="930" rx="320" ry="34" fill="url(#floor)"/>
</svg>
</body></html>
