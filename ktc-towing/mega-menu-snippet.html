<!--
  KTC Towing – Services mega menu (desktop)
  Elementor > Custom Code > "KTC – Services mega menu" (location: <head>)

  How it works
  - The menu itself is still the WordPress menu "Main" (Appearance > Menus),
    rendered by the ElementsKit Nav Menu widget in the header template.
  - The small script below marks every top-level item whose dropdown contains
    groups (sub-items that have their own children) with the class "ktc-mega".
    Today that is "Services" with its 3 groups.
  - The CSS turns that dropdown into a 3-column panel: each group title becomes a
    column heading and its links are always visible underneath.
  - The script also appends a "24/7 dispatch" card as the last column.
  - Desktop (min-width: 1025px): 3-column panel + dispatch card.
  - Mobile/tablet (max-width: 1024px, the ElementsKit off-canvas menu): dark drawer,
    "Services" still opens/closes, but the 3 groups show as labels with their links
    already listed (no extra taps), a visible close button, and Call / WhatsApp
    buttons at the bottom of the drawer (added by the script).
  - If the script does not run, the menu falls back to the normal dropdown.
-->
<style>
@media (min-width: 1025px) {

  /* 1. Position the panel relative to the whole menu bar (not the "Services" item),
        so it stays centred and never runs off-screen. */
  .elementskit-navbar-nav.ktc-mega-nav { position: relative; }
  .elementskit-navbar-nav > li.ktc-mega { position: static !important; }

  /* 2. The panel: 3 link columns + 1 card column. */
  .elementskit-navbar-nav > li.ktc-mega > .elementskit-submenu-panel {
    display: grid !important;
    grid-template-columns: repeat(3, minmax(0, 1fr)) 230px;
    gap: 6px 28px;
    width: 940px !important;
    max-width: calc(100vw - 40px);
    left: 50% !important;
    right: auto !important;
    margin-left: -470px;
    padding: 28px 28px 26px !important;
    background: #fff !important;
    border: 1px solid rgba(0, 0, 0, .06) !important;
    border-top: 3px solid #FFA300 !important;
    border-radius: 0 0 18px 18px !important;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .14) !important;
  }
  /* keyboard users: open the panel when focus is inside it */
  .elementskit-navbar-nav > li.ktc-mega:focus-within > .elementskit-submenu-panel {
    opacity: 1; visibility: visible;
  }

  /* 3. Group items (Emergency & Roadside, …) become column headings. */
  /* remove ElementsKit's default dividers / padding inside the panel */
  .ktc-mega .elementskit-submenu-panel li,
  .ktc-mega .elementskit-submenu-panel li > a { border: 0 !important; line-height: 1.35 !important; }
  .ktc-mega > .elementskit-submenu-panel > li:not(.ktc-mega-card) { background: none !important; padding: 0 !important; }
  .ktc-mega > .elementskit-submenu-panel > li:not(.ktc-mega-card) > a {
    display: flex !important; align-items: center; justify-content: flex-start !important; gap: 10px;
    padding: 0 0 12px !important; margin-bottom: 8px;
    border-bottom: 1px solid rgba(0, 0, 0, .08) !important;
    font-size: 11.5px !important; font-weight: 700 !important; white-space: nowrap;
    letter-spacing: .8px; text-transform: uppercase;
    color: #C77E00 !important; background: none !important;
    cursor: default; pointer-events: none;           /* headings have no page of their own */
  }
  .ktc-mega > .elementskit-submenu-panel > li:not(.ktc-mega-card) > a::before {   /* small orange marker */
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: #FFA300; box-shadow: 0 0 0 4px rgba(255, 163, 0, .18);
  }
  .ktc-mega > .elementskit-submenu-panel > li:not(.ktc-mega-card) > a .elementskit-submenu-indicator { display: none !important; }

  /* 4. Second-level lists: always visible inside their column (no fly-outs). */
  .ktc-mega .elementskit-submenu-panel .elementskit-submenu-panel {
    position: static !important; display: block !important;
    opacity: 1 !important; visibility: visible !important; transform: none !important;
    width: auto !important; min-width: 0 !important;
    padding: 0 !important; margin: 0 !important;
    border: 0 !important; box-shadow: none !important; background: none !important;
  }
  .ktc-mega .elementskit-submenu-panel .elementskit-submenu-panel > li { border: 0 !important; }
  .ktc-mega .elementskit-submenu-panel .elementskit-submenu-panel a {
    display: flex !important; align-items: center; justify-content: space-between;
    padding: 8px 10px !important; margin: 0 -10px;
    border-radius: 10px; font-size: 15px !important; color: #1a1a1a !important;
    transition: background .2s, color .2s, padding .2s;
  }
  .ktc-mega .elementskit-submenu-panel .elementskit-submenu-panel a::after {  /* arrow on hover */
    content: "→"; opacity: 0; transform: translateX(-6px);
    transition: opacity .2s, transform .2s; color: #FFA300; font-weight: 700;
  }
  .ktc-mega .elementskit-submenu-panel .elementskit-submenu-panel a:hover,
  .ktc-mega .elementskit-submenu-panel .elementskit-submenu-panel a:focus-visible {
    background: #FFF4DD !important; color: #000 !important;
  }
  .ktc-mega .elementskit-submenu-panel .elementskit-submenu-panel a:hover::after,
  .ktc-mega .elementskit-submenu-panel .elementskit-submenu-panel a:focus-visible::after {
    opacity: 1; transform: none;
  }

  /* 5. Dispatch card (added by the script below). */
  .ktc-mega .elementskit-submenu-panel > li.ktc-mega-card {
    grid-column: 4; grid-row: 1;
    background: #111 !important; border-radius: 14px; padding: 22px 20px !important;
    display: flex !important; flex-direction: column; gap: 8px;
    position: relative; overflow: hidden;
  }
  .ktc-mega-card::before {      /* soft orange glow */
    content: ""; position: absolute; right: -50px; top: -50px; width: 150px; height: 150px;
    border-radius: 50%; background: radial-gradient(circle, rgba(255,163,0,.45), rgba(255,163,0,0) 70%);
  }
  .ktc-mega-card__tag {
    align-self: flex-start; background: #FFA300; color: #000; border-radius: 50px;
    padding: 4px 10px; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  }
  .ktc-mega-card p { position: relative; }
  .ktc-mega-card__title { color: #fff; font-size: 17px; font-weight: 700; line-height: 1.3; margin: 6px 0 0; }
  .ktc-mega-card__text  { color: rgba(255,255,255,.72); font-size: 13px; line-height: 1.5; margin: 0; }
  .ktc-mega-card a.ktc-mega-card__phone {
    display: block !important; padding: 0 !important; margin-top: 4px;
    color: #FFA300 !important; font-size: 21px !important; font-weight: 800 !important; background: none !important;
  }
  .ktc-mega-card a.ktc-mega-card__all {
    display: inline-block !important; margin-top: auto; padding: 0 !important;
    color: #fff !important; font-size: 13px !important; font-weight: 600 !important;
    background: none !important; text-decoration: underline; text-underline-offset: 3px;
  }
}

/* ============================ MOBILE / TABLET DRAWER ============================ */
@media (max-width: 1024px) {

  /* The desktop dispatch card is replaced by the drawer buttons below. */
  .ktc-mega-card { display: none !important; }

  /* 1. Drawer + header row (logo / close) */
  .elementskit-menu-container.elementskit-menu-offcanvas-elements {
    background: #0d0d0d !important; display: flex !important; flex-direction: column;
    max-width: 340px !important; box-shadow: 20px 0 60px rgba(0, 0, 0, .45);
    overflow: hidden !important;
  }
  /* the link list scrolls between the fixed logo row and the fixed Call/WhatsApp buttons */
  .elementskit-menu-offcanvas-elements > .elementskit-navbar-nav {
    flex: 1 1 auto; min-height: 0; overflow-y: auto !important; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  .elementskit-nav-identity-panel {
    order: -1;                                /* logo + close always on top (it comes after the list in the HTML) */
    display: flex !important; align-items: center; justify-content: space-between;
    padding: 16px 20px !important; border-bottom: 1px solid rgba(255, 255, 255, .08);
  }
  .elementskit-nav-identity-panel .elementskit-nav-logo img { max-width: 96px !important; }
  .elementskit-menu-close {                 /* was an orange box with an invisible "X" */
    position: static !important; width: 40px !important; height: 40px !important;
    border-radius: 50% !important; padding: 0 !important; border: 1px solid rgba(255, 255, 255, .25) !important;
    background: transparent !important; color: transparent !important; font-size: 0 !important;
    display: inline-flex !important; align-items: center; justify-content: center; position: relative !important;
  }
  .elementskit-menu-close::before, .elementskit-menu-close::after {
    content: ""; position: absolute; width: 16px; height: 2px; border-radius: 2px; background: #fff;
    transform: rotate(45deg);
  }
  .elementskit-menu-close::after { transform: rotate(-45deg); }

  /* 2. Top-level items */
  .elementskit-menu-offcanvas-elements .elementskit-navbar-nav { padding: 8px 0 !important; }
  .elementskit-menu-offcanvas-elements .elementskit-navbar-nav > li { border-bottom: 1px solid rgba(255, 255, 255, .07) !important; }
  .elementskit-menu-offcanvas-elements .elementskit-navbar-nav > li > a {
    padding: 15px 20px !important; font-size: 16px !important; font-weight: 600 !important; color: #fff !important;
  }
  .elementskit-menu-offcanvas-elements .elementskit-navbar-nav > li.active > a,
  .elementskit-menu-offcanvas-elements .elementskit-navbar-nav > li > a.active { color: #FFA300 !important; }
  .elementskit-menu-offcanvas-elements .elementskit-navbar-nav > li > a .elementskit-submenu-indicator {
    width: 32px; height: 32px; border-radius: 50% !important; border: 1px solid rgba(255, 163, 0, .6) !important;
    display: inline-flex !important; align-items: center; justify-content: center; color: #FFA300 !important;
    transition: transform .25s;
  }
  .elementskit-menu-offcanvas-elements .elementskit-navbar-nav > li > a[aria-expanded="true"] .elementskit-submenu-indicator { transform: rotate(180deg); }

  /* 3. Services panel: dark, groups as labels, links always listed */
  .ktc-mega > .elementskit-submenu-panel {
    background: #161616 !important; padding: 6px 20px 14px !important; border: 0 !important;
  }
  .ktc-mega > .elementskit-submenu-panel > li { border: 0 !important; background: none !important; }
  .ktc-mega > .elementskit-submenu-panel > li > a {
    padding: 14px 0 6px !important; background: none !important; pointer-events: none;   /* labels, not toggles */
    font-size: 11.5px !important; font-weight: 700 !important; letter-spacing: 1px; text-transform: uppercase;
    color: #FFA300 !important; border: 0 !important;
  }
  .ktc-mega > .elementskit-submenu-panel > li > a .elementskit-submenu-indicator { display: none !important; }
  .ktc-mega .elementskit-submenu-panel .elementskit-submenu-panel {
    display: block !important; position: static !important; opacity: 1 !important; visibility: visible !important;
    transform: none !important; max-height: none !important; height: auto !important;
    background: none !important; padding: 0 !important; margin: 0 !important; border: 0 !important; box-shadow: none !important;
  }
  .ktc-mega .elementskit-submenu-panel .elementskit-submenu-panel > li { border: 0 !important; }
  .ktc-mega .elementskit-submenu-panel .elementskit-submenu-panel a {
    display: block !important; padding: 9px 0 9px 14px !important; margin: 0 !important;
    border-top: 0 !important; border-right: 0 !important; border-bottom: 0 !important;
    border-left: 2px solid rgba(255, 255, 255, .1) !important; background: none !important;
    color: rgba(255, 255, 255, .85) !important; font-size: 15px !important; line-height: 1.35 !important;
  }
  .ktc-mega .elementskit-submenu-panel .elementskit-submenu-panel a:active,
  .ktc-mega .elementskit-submenu-panel .elementskit-submenu-panel a:hover {
    border-left-color: #FFA300 !important; color: #fff !important;
  }

  /* 4. Call / WhatsApp buttons at the bottom of the drawer (added by the script) */
  .ktc-drawer-cta {                          /* stays visible at the bottom while the list scrolls */
    flex: 0 0 auto; margin-top: auto; background: #0d0d0d;
    padding: 16px 20px 22px; border-top: 1px solid rgba(255, 255, 255, .08);
  }
  /* hide the floating WhatsApp bubble while the drawer is open (the drawer has its own buttons) */
  body:has(.elementskit-menu-offcanvas-elements.active) .whatsapp-float { display: none !important; }
  .ktc-drawer-cta__label { color: rgba(255, 255, 255, .6); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; margin: 0 0 10px; }
  .ktc-drawer-cta a {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 12px; padding: 14px; font-weight: 700; font-size: 16px; text-decoration: none;
  }
  .ktc-drawer-cta a + a { margin-top: 10px; }
  .ktc-drawer-cta__call { background: #FFA300; color: #000 !important; }
  .ktc-drawer-cta__wa { background: #25D366; color: #fff !important; }
}
@media (min-width: 1025px) { .ktc-drawer-cta { display: none !important; } }
</style>

<script>
/* KTC – Services mega menu: mark mega items + add the dispatch card (desktop styling lives in the CSS above). */
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.elementskit-navbar-nav').forEach(function (nav) {
    nav.querySelectorAll(':scope > li.menu-item-has-children').forEach(function (item) {
      var panel = item.querySelector(':scope > .elementskit-submenu-panel');
      // Only dropdowns that contain groups (children with their own children) become mega panels.
      if (!panel || !panel.querySelector(':scope > li.menu-item-has-children')) return;

      nav.classList.add('ktc-mega-nav');
      item.classList.add('ktc-mega');

      var card = document.createElement('li');
      card.className = 'ktc-mega-card';
      card.setAttribute('role', 'presentation');
      card.innerHTML =
        '<span class="ktc-mega-card__tag">24/7 Dispatch</span>' +
        '<p class="ktc-mega-card__title">Need a tow right now?</p>' +
        '<p class="ktc-mega-card__text">Quote and ETA before we dispatch. Average arrival about 20 minutes.</p>' +
        '<a class="ktc-mega-card__phone" href="tel:+15874350770">(587) 435-0770</a>' +
        '<a class="ktc-mega-card__all" href="' + (item.querySelector(':scope > a').href || '/services/') + '">View all services</a>';
      panel.appendChild(card);
    });

    // Mobile drawer: Call / WhatsApp buttons under the menu (hidden on desktop by CSS).
    var drawer = nav.closest('.elementskit-menu-offcanvas-elements');
    if (drawer && !drawer.querySelector('.ktc-drawer-cta')) {
      var cta = document.createElement('div');
      cta.className = 'ktc-drawer-cta';
      cta.innerHTML =
        '<p class="ktc-drawer-cta__label">24/7 dispatch, Calgary</p>' +
        '<a class="ktc-drawer-cta__call" href="tel:+15874350770">Call (587) 435-0770</a>' +
        '<a class="ktc-drawer-cta__wa" href="https://api.whatsapp.com/send/?phone=15874350770&amp;text=Hi+KTC+Towing%2C+I+need+help+with+my+vehicle.">WhatsApp us</a>';
      drawer.appendChild(cta);
    }
  });
});
</script>
