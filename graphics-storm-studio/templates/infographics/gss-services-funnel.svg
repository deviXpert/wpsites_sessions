<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="600" height="460" role="img" aria-labelledby="t d">
<title id="t">Digital marketing funnel infographic</title><desc id="d">Animated infographic: social media, design and ads attract visitors, SEO ranks you, your website converts them and you grow with more leads and sales.</desc>
<defs>
<linearGradient id="gBV" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0684C4"/><stop offset="1" stop-color="#7052FF"/></linearGradient>
<linearGradient id="gSky" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5DB0D8"/><stop offset=".5" stop-color="#0684C4"/><stop offset="1" stop-color="#9D86FF"/></linearGradient>
<linearGradient id="gBar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0684C4"/><stop offset="1" stop-color="#9D86FF"/></linearGradient>
<radialGradient id="glowV"><stop offset="0" stop-color="#7052FF" stop-opacity=".45"/><stop offset="1" stop-color="#7052FF" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB"><stop offset="0" stop-color="#0684C4" stop-opacity=".45"/><stop offset="1" stop-color="#0684C4" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".55"/></filter>
</defs>
<style>
text{font-family:'Sora','Inter','Segoe UI',Roboto,Arial,sans-serif;fill:#fff} .m{fill:#C9D3E8} .s{fill:#93A1BF} .a{fill:#5DB0D8}
.glass{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.18);stroke-width:1}
.glass2{fill:rgba(255,255,255,.11);stroke:rgba(255,255,255,.22);stroke-width:1}
.flow{fill:none;stroke:url(#gSky);stroke-width:2;stroke-dasharray:5 9;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.float{animation:float 5s ease-in-out infinite} @keyframes float{50%{transform:translateY(-6px)}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 4s cubic-bezier(.2,.7,.2,1) infinite}
@keyframes grow{0%{transform:scaleY(.08)}35%,85%{transform:scaleY(1)}100%{transform:scaleY(.08)}}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:600}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:600}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 5s ease-in-out infinite}
@keyframes pop{0%,8%{transform:scale(0);opacity:0}16%,88%{transform:scale(1);opacity:1}100%{transform:scale(0);opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important} .draw{stroke-dashoffset:0} .pop{transform:none;opacity:1}}
</style>
<circle r="4.5" fill="#fff"><animateMotion dur="3s" begin="0.0s" repeatCount="indefinite" path="M240.0 30 V 420"/><animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle><circle r="4.5" fill="#fff"><animateMotion dur="3s" begin="0.6s" repeatCount="indefinite" path="M330.0 30 V 420"/><animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle><circle r="4.5" fill="#fff"><animateMotion dur="3s" begin="1.2s" repeatCount="indefinite" path="M285.0 30 V 420"/><animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle><circle r="4.5" fill="#fff"><animateMotion dur="3s" begin="1.8s" repeatCount="indefinite" path="M355.0 30 V 420"/><animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle><circle r="4.5" fill="#fff"><animateMotion dur="3s" begin="2.4s" repeatCount="indefinite" path="M260.0 30 V 420"/><animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="2.4s" repeatCount="indefinite"/></circle><g class="pop" style="animation-delay:0.10s"><g filter="url(#soft)"><path d="M60.0 46 H540.0 L504.0 122 H96.0 Z" fill="#9D86FF" fill-opacity=".28" stroke="#9D86FF" stroke-opacity=".7"/></g>
<text x="300.0" y="80" text-anchor="middle" font-size="17" font-weight="800">Attract</text><text class="m" x="300.0" y="100" text-anchor="middle" font-size="11.5">Social media · Design · Ads</text></g><g class="pop" style="animation-delay:0.45s"><g filter="url(#soft)"><path d="M100.0 138 H500.0 L464.0 214 H136.0 Z" fill="#7052FF" fill-opacity=".28" stroke="#7052FF" stroke-opacity=".7"/></g>
<text x="300.0" y="172" text-anchor="middle" font-size="17" font-weight="800">Rank</text><text class="m" x="300.0" y="192" text-anchor="middle" font-size="11.5">SEO · Content</text></g><g class="pop" style="animation-delay:0.80s"><g filter="url(#soft)"><path d="M140.0 230 H460.0 L424.0 306 H176.0 Z" fill="#0684C4" fill-opacity=".28" stroke="#0684C4" stroke-opacity=".7"/></g>
<text x="300.0" y="264" text-anchor="middle" font-size="17" font-weight="800">Convert</text><text class="m" x="300.0" y="284" text-anchor="middle" font-size="11.5">Website · Landing pages</text></g><g class="pop" style="animation-delay:1.15s"><g filter="url(#soft)"><path d="M180.0 322 H420.0 L384.0 398 H216.0 Z" fill="#5DB0D8" fill-opacity=".28" stroke="#5DB0D8" stroke-opacity=".7"/></g>
<text x="300.0" y="356" text-anchor="middle" font-size="17" font-weight="800">Grow</text><text class="m" x="300.0" y="376" text-anchor="middle" font-size="11.5">Leads · Sales · Loyalty</text></g>
<g class="pop" style="animation-delay:1.8s"><rect x="210" y="414" width="180" height="34" rx="17" fill="#7052FF"/><text x="300" y="436" text-anchor="middle" font-size="12.5" font-weight="700">▲ More customers</text></g>
</svg>