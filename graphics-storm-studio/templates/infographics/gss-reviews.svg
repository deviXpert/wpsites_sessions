<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480" role="img" aria-labelledby="t d">
<title id="t">Client reviews infographic</title><desc id="d">Animated infographic: a 5.0 client rating with five stars and review cards from website, branding and marketing clients.</desc>
<defs>
<linearGradient id="gBV" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0684C4"/><stop offset="1" stop-color="#7052FF"/></linearGradient>
<linearGradient id="gSky" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5DB0D8"/><stop offset=".5" stop-color="#0684C4"/><stop offset="1" stop-color="#9D86FF"/></linearGradient>
<linearGradient id="gBar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0684C4"/><stop offset="1" stop-color="#9D86FF"/></linearGradient>
<radialGradient id="glowV"><stop offset="0" stop-color="#7052FF" stop-opacity=".45"/><stop offset="1" stop-color="#7052FF" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB"><stop offset="0" stop-color="#0684C4" stop-opacity=".45"/><stop offset="1" stop-color="#0684C4" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".55"/></filter>
</defs>
<style>
text{font-family:'Sora','Inter','Segoe UI',Roboto,Arial,sans-serif;fill:#fff} .m{fill:#C9D3E8} .s{fill:#93A1BF} .a{fill:#5DB0D8}
.glass{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.18);stroke-width:1}
.glass2{fill:rgba(255,255,255,.11);stroke:rgba(255,255,255,.22);stroke-width:1}
.flow{fill:none;stroke:url(#gSky);stroke-width:2;stroke-dasharray:5 9;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.float{animation:float 5s ease-in-out infinite} @keyframes float{50%{transform:translateY(-6px)}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 4s cubic-bezier(.2,.7,.2,1) infinite}
@keyframes grow{0%{transform:scaleY(.08)}35%,85%{transform:scaleY(1)}100%{transform:scaleY(.08)}}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:600}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:600}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 5s ease-in-out infinite}
@keyframes pop{0%,8%{transform:scale(0);opacity:0}16%,88%{transform:scale(1);opacity:1}100%{transform:scale(0);opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important} .draw{stroke-dashoffset:0} .pop{transform:none;opacity:1}}
</style>
<g filter="url(#soft)"><rect class="glass2" x="40" y="70" width="190" height="170" rx="20"/></g>
<text class="a" x="62" y="100" font-size="10.5" font-weight="700" letter-spacing="1.4">CLIENT RATING</text>
<text x="60" y="142" font-size="38" font-weight="800">5.0</text>
<g transform="translate(-4 0)"><g class="pop" style="animation-delay:0.20s"><path transform="translate(78 160) scale(1.3)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/></g><g class="pop" style="animation-delay:0.38s"><path transform="translate(108 160) scale(1.3)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/></g><g class="pop" style="animation-delay:0.56s"><path transform="translate(138 160) scale(1.3)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/></g><g class="pop" style="animation-delay:0.74s"><path transform="translate(168 160) scale(1.3)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/></g><g class="pop" style="animation-delay:0.92s"><path transform="translate(198 160) scale(1.3)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/></g></g>
<text class="m" x="62" y="200" font-size="11">from verified clients</text><text class="m" x="62" y="218" font-size="11">USA · Canada · worldwide</text>
<g class="float" style="animation-delay:0.00s"><g class="pop" style="animation-delay:1.10s"><g filter="url(#soft)"><rect class="glass2" x="250" y="70" width="300" height="96" rx="18"/></g>
<circle cx="280" cy="102" r="14" fill="url(#gBV)"/><text x="280" y="107" text-anchor="middle" font-size="12" font-weight="800">M</text>
<path transform="translate(310 98) scale(0.65)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/><path transform="translate(326 98) scale(0.65)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/><path transform="translate(342 98) scale(0.65)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/><path transform="translate(358 98) scale(0.65)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/><path transform="translate(374 98) scale(0.65)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/>
<text x="270" y="134" font-size="12.5" font-weight="700">“Fantastic brand guidelines and logos!”</text><text class="m" x="270" y="152" font-size="10.5">Mr. James · Branding</text></g></g><g class="float" style="animation-delay:0.80s"><g class="pop" style="animation-delay:1.60s"><g filter="url(#soft)"><rect class="glass2" x="290" y="190" width="300" height="96" rx="18"/></g>
<circle cx="320" cy="222" r="14" fill="url(#gBV)"/><text x="320" y="227" text-anchor="middle" font-size="12" font-weight="800">A</text>
<path transform="translate(350 218) scale(0.65)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/><path transform="translate(366 218) scale(0.65)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/><path transform="translate(382 218) scale(0.65)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/><path transform="translate(398 218) scale(0.65)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/><path transform="translate(414 218) scale(0.65)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/>
<text x="310" y="254" font-size="12.5" font-weight="700">“Fast communication, great result.”</text><text class="m" x="310" y="272" font-size="10.5">Anthony · Website</text></g></g><g class="float" style="animation-delay:1.60s"><g class="pop" style="animation-delay:2.10s"><g filter="url(#soft)"><rect class="glass2" x="250" y="310" width="300" height="96" rx="18"/></g>
<circle cx="280" cy="342" r="14" fill="url(#gBV)"/><text x="280" y="347" text-anchor="middle" font-size="12" font-weight="800">L</text>
<path transform="translate(310 338) scale(0.65)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/><path transform="translate(326 338) scale(0.65)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/><path transform="translate(342 338) scale(0.65)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/><path transform="translate(358 338) scale(0.65)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/><path transform="translate(374 338) scale(0.65)" d="M0 -10 L2.9 -3.1 L10 -3.1 L4.3 1.2 L6.5 8.1 L0 4 L-6.5 8.1 L-4.3 1.2 L-10 -3.1 L-2.9 -3.1 Z" fill="#FFC857"/>
<text x="270" y="374" font-size="12.5" font-weight="700">“Brief well met, fast delivery.”</text><text class="m" x="270" y="392" font-size="10.5">Lisa P. · Marketing</text></g></g>
<g class="pop" style="animation-delay:2.8s"><rect x="40" y="290" width="190" height="40" rx="20" fill="#7052FF"/><text x="135" y="315" text-anchor="middle" font-size="13" font-weight="700">✎ Leave a review</text></g>
</svg>