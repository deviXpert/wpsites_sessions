<circle cx="110" cy="232" r="10" fill="url(#gBV)"/><path d="M94 258 a16 13 0 0 1 32 0" fill="url(#gBV)"/>
<text x="110" y="292" text-anchor="middle" font-size="11.5" font-weight="700">Projects</text></g></g><g class="float" style="animation-delay:1.80s"><g class="pop" style="animation-delay:1.10s"><g filter="url(#soft)"><circle cx="490" cy="240" r="34" class="glass2"/></g>
<circle cx="490" cy="232" r="10" fill="url(#gBV)"/><path d="M474 258 a16 13 0 0 1 32 0" fill="url(#gBV)"/>
<text x="490" y="292" text-anchor="middle" font-size="11.5" font-weight="700">Content</text></g></g><g class="float" style="animation-delay:2.40s"><g class="pop" style="animation-delay:1.40s"><g filter="url(#soft)"><circle cx="300" cy="328" r="34" class="glass2"/></g>
<circle cx="300" cy="320" r="10" fill="url(#gBV)"/><path d="M284 346 a16 13 0 0 1 32 0" fill="url(#gBV)"/>
<text x="300" y="380" text-anchor="middle" font-size="11.5" font-weight="700">Design</text></g></g><g class="pop" style="animation-delay:1.60s"><g filter="url(#soft)"><rect class="glass2" x="28" y="418" width="156" height="50" rx="16"/></g>
<text x="44" y="450" font-size="20" font-weight="800">5+</text><text class="m" x="80" y="449" font-size="11.5">years</text></g><g class="pop" style="animation-delay:1.95s"><g filter="url(#soft)"><rect class="glass2" x="222" y="430" width="156" height="50" rx="16"/></g>
<text x="238" y="462" font-size="20" font-weight="800">130+</text><text class="m" x="300" y="461" font-size="11.5">clients</text></g><g class="pop" style="animation-delay:2.30s"><g filter="url(#soft)"><rect class="glass2" x="416" y="418" width="156" height="50" rx="16"/></g>
<text x="432" y="450" font-size="20" font-weight="800">180+</text><text class="m" x="494" y="449" font-size="11.5">websites</text></g>
